<div class="p-4 max-w-7xl mx-auto">

<form id="torrentUploadForm" enctype="multipart/form-data">

    <!-- HEADER -->
    <div class="mb-8">

        <p class="text-xs uppercase tracking-[0.2em] text-[#5864be] font-semibold mb-2">
            TORRENT
        </p>

        <h1 class="text-3xl md:text-4xl font-bold">
            Publicar Torrent
        </h1>

        <p class="text-zinc-500 mt-2">
            Envie seu arquivo e preencha as informações do conteúdo.
        </p>

    </div>


    <!-- GRID -->
    <div class="grid lg:grid-cols-3 gap-6">


        <!-- ========================= -->
        <!-- UPLOAD -->
        <!-- ========================= -->

        <div class="lg:col-span-2 bg-[#171717] rounded-[28px] border border-white/10 overflow-hidden">

            <div class="p-5 md:p-6">

                <div
                    id="dropZone"
                    class="
                        relative
                        rounded-[28px]
                        border-2
                        border-dashed
                        border-[#5864be]/30
                        bg-[linear-gradient(145deg,var(--card),var(--card2))]
                        p-8 md:p-14
                        text-center
                        transition-all
                        duration-300
                        cursor-pointer
                        hover:border-[#5864be]
                    "
                >

                    <!-- ÍCONE -->
                    <div
                        id="uploadIcon"
                        class="
                            w-20
                            h-20
                            mx-auto
                            mb-6
                            rounded-[24px]
                            bg-[#5864be]/10
                            border
                            border-[#5864be]/20
                            flex
                            items-center
                            justify-center
                            transition-all
                        "
                    >

                        <svg
                            class="w-9 h-9 text-[#5864be]"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="1.8"
                                d="M12 16V4m0 0L7 9m5-5 5 5M4 20h16"
                            />
                        </svg>

                    </div>


                    <!-- TÍTULO -->
                    <h2
                        id="uploadTitle"
                        class="text-2xl font-bold mb-3"
                    >
                        Upload Torrent
                    </h2>


                    <!-- DESCRIÇÃO -->
                    <p
                        id="uploadDescription"
                        class="text-zinc-500 max-w-md mx-auto mb-8"
                    >
                        Arraste seu arquivo
                        <strong class="text-zinc-300">.torrent</strong>
                        aqui ou selecione manualmente.
                    </p>


                    <!-- ARQUIVO SELECIONADO -->
                    <div
                        id="selectedFile"
                        class="
                            hidden
                            max-w-lg
                            mx-auto
                            mb-6
                            p-4
                            rounded-2xl
                            bg-black/20
                            border
                            border-white/10
                            text-left
                        "
                    >

                        <div class="flex items-center gap-4">

                            <div
                                class="
                                    w-11
                                    h-11
                                    shrink-0
                                    rounded-xl
                                    bg-[#5864be]/10
                                    flex
                                    items-center
                                    justify-center
                                "
                            >

                                <svg
                                    class="w-5 h-5 text-[#5864be]"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="1.8"
                                        d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                                    />
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="1.8"
                                        d="M14 2v6h6M8 13h8M8 17h5"
                                    />
                                </svg>

                            </div>


                            <div class="min-w-0 flex-1">

                                <p
                                    id="fileName"
                                    class="font-medium truncate"
                                >
                                    arquivo.torrent
                                </p>

                                <p
                                    id="fileSize"
                                    class="text-xs text-zinc-500 mt-1"
                                >
                                    0 MB
                                </p>

                            </div>


                            <button
                                type="button"
                                id="removeFile"
                                class="
                                    w-9
                                    h-9
                                    rounded-xl
                                    flex
                                    items-center
                                    justify-center
                                    text-zinc-500
                                    hover:text-white
                                    hover:bg-white/5
                                    transition
                                "
                            >

                                <svg
                                    class="w-4 h-4"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="1.8"
                                        d="M6 6l12 12M18 6 6 18"
                                    />
                                </svg>

                            </button>

                        </div>

                    </div>


                    <!-- BOTÃO -->
                    <label
                        class="
                            inline-flex
                            items-center
                            justify-center
                            gap-2
                            h-12
                            px-6
                            rounded-2xl
                            bg-[#5864be]
                            text-white
                            font-semibold
                            cursor-pointer
                            hover:opacity-90
                            transition
                        "
                    >

                        <svg
                            class="w-4 h-4"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="1.8"
                                d="M12 16V4m0 0L7 9m5-5 5 5M4 20h16"
                            />
                        </svg>

                        Selecionar arquivo

                        <input
                            id="torrentFile"
                            name="torrent"
                            type="file"
                            accept=".torrent"
                            class="hidden"
                        >

                    </label>


                    <p class="text-xs text-zinc-600 mt-5">
                        Somente arquivos .torrent
                    </p>

                </div>


                <!-- STATUS -->
                <div
                    id="uploadStatus"
                    class="
                        hidden
                        mt-5
                        p-4
                        rounded-2xl
                        border
                        border-white/10
                        bg-black/10
                    "
                >

                    <div class="flex items-start gap-3">

                        <div
                            id="statusIcon"
                            class="
                                w-9
                                h-9
                                shrink-0
                                rounded-xl
                                bg-white/5
                                flex
                                items-center
                                justify-center
                            "
                        ></div>

                        <div class="min-w-0">

                            <p
                                id="statusTitle"
                                class="font-semibold"
                            >
                                Preparando...
                            </p>

                            <p
                                id="statusMessage"
                                class="text-sm text-zinc-500 mt-1"
                            >
                                Aguarde.
                            </p>

                        </div>

                    </div>

                </div>


                <!-- PROGRESSO -->
                <div
                    id="uploadProgress"
                    class="hidden mt-5"
                >

                    <div class="flex items-center justify-between mb-2">

                        <span class="text-xs text-zinc-500">
                            Enviando para o servidor
                        </span>

                        <span
                            id="progressPercent"
                            class="text-xs font-semibold text-[#5864be]"
                        >
                            0%
                        </span>

                    </div>


                    <div class="h-2 rounded-full bg-black/30 overflow-hidden">

                        <div
                            id="progressBar"
                            class="
                                h-full
                                w-0
                                bg-[#5864be]
                                rounded-full
                                transition-all
                                duration-200
                            "
                        ></div>

                    </div>

                </div>

            </div>

        </div>


        <!-- ========================= -->
        <!-- INFORMAÇÕES -->
        <!-- ========================= -->

        <div class="bg-[#171717] rounded-[28px] border border-white/10">

            <div class="p-5 md:p-6">

                <div class="mb-7">

                    <h2 class="text-xl font-bold">
                        Informações
                    </h2>

                    <p class="text-sm text-zinc-500 mt-1">
                        Dados do conteúdo.
                    </p>

                </div>


                <!-- TÍTULO -->
                <div class="mb-5">

                    <label
                        for="title"
                        class="block text-sm font-medium mb-2"
                    >
                        Título
                    </label>

                    <input
                        id="title"
                        name="title"
                        type="text"
                        required
                        placeholder="Ex: Frieren [1080p][H265]"
                        class="
                            w-full
                            h-12
                            px-4
                            rounded-2xl
                            bg-black/10
                            border
                            border-white/10
                            outline-none
                            focus:border-[#5864be]
                            transition
                        "
                    >

                </div>


                <!-- DESCRIÇÃO -->
                <div class="mb-5">

                    <label
                        for="description"
                        class="block text-sm font-medium mb-2"
                    >
                        Descrição
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="5"
                        placeholder="Descreva o conteúdo..."
                        class="
                            w-full
                            p-4
                            rounded-2xl
                            bg-black/10
                            border
                            border-white/10
                            outline-none
                            resize-none
                            focus:border-[#5864be]
                            transition
                        "
                    ></textarea>

                </div>


                <!-- CATEGORIA -->
                <div class="mb-5">

                    <label
                        class="block text-sm font-medium mb-3"
                    >
                        Categoria
                    </label>

                    <input
                        type="hidden"
                        id="category"
                        name="category"
                        value="Anime"
                    >

                    <div
                        id="categoryList"
                        class="grid grid-cols-2 gap-2"
                    >

                        <button
                            type="button"
                            data-category="Anime"
                            class="
                                categoryBtn
                                h-11
                                rounded-xl
                                bg-[#5864be]
                                text-white
                                text-sm
                                font-medium
                                transition
                            "
                        >
                            Anime
                        </button>

                        <button
                            type="button"
                            data-category="Filme"
                            class="
                                categoryBtn
                                h-11
                                rounded-xl
                                bg-black/10
                                border
                                border-white/10
                                text-sm
                                font-medium
                                hover:border-[#5864be]
                                transition
                            "
                        >
                            Filme
                        </button>

                        <button
                            type="button"
                            data-category="OVA"
                            class="
                                categoryBtn
                                h-11
                                rounded-xl
                                bg-black/10
                                border
                                border-white/10
                                text-sm
                                font-medium
                                hover:border-[#5864be]
                                transition
                            "
                        >
                            OVA
                        </button>

                        <button
                            type="button"
                            data-category="Música"
                            class="
                                categoryBtn
                                h-11
                                rounded-xl
                                bg-black/10
                                border
                                border-white/10
                                text-sm
                                font-medium
                                hover:border-[#5864be]
                                transition
                            "
                        >
                            Música
                        </button>

                    </div>

                </div>


                <!-- TAGS -->
                <div class="mb-6">

                    <label
                        for="tags"
                        class="block text-sm font-medium mb-2"
                    >
                        Tags
                    </label>

                    <input
                        id="tags"
                        name="tags"
                        type="text"
                        placeholder="1080p, H265, BluRay..."
                        class="
                            w-full
                            h-12
                            px-4
                            rounded-2xl
                            bg-black/10
                            border
                            border-white/10
                            outline-none
                            focus:border-[#5864be]
                            transition
                        "
                    >

                </div>


                <!-- OPÇÕES -->
                <div class="space-y-3 mb-7">

                    <!-- GOLD -->
                    <label
                        class="
                            flex
                            items-center
                            justify-between
                            p-4
                            rounded-2xl
                            bg-black/10
                            border
                            border-white/5
                            cursor-pointer
                        "
                    >

                        <div>

                            <p class="font-medium text-sm">
                                Gold Coin
                            </p>

                            <p class="text-xs text-zinc-500 mt-1">
                                Benefício especial por 48h.
                            </p>

                        </div>

                        <input
                            id="gold"
                            name="gold"
                            type="checkbox"
                            value="true"
                            class="sr-only peer"
                        >

                        <div
                            class="
                                relative
                                w-11
                                h-6
                                rounded-full
                                bg-zinc-700
                                peer-checked:bg-[#5864be]
                                transition
                                after:content-['']
                                after:absolute
                                after:top-1
                                after:left-1
                                after:w-4
                                after:h-4
                                after:bg-white
                                after:rounded-full
                                after:transition
                                peer-checked:after:translate-x-5
                            "
                        ></div>

                    </label>


                    <!-- ADULTO -->
                    <label
                        class="
                            flex
                            items-center
                            justify-between
                            p-4
                            rounded-2xl
                            bg-black/10
                            border
                            border-white/5
                            cursor-pointer
                        "
                    >

                        <div>

                            <p class="font-medium text-sm">
                                Conteúdo restrito
                            </p>

                            <p class="text-xs text-zinc-500 mt-1">
                                Marca conteúdo +18.
                            </p>

                        </div>

                        <input
                            id="adult"
                            name="adult"
                            type="checkbox"
                            value="true"
                            class="sr-only peer"
                        >

                        <div
                            class="
                                relative
                                w-11
                                h-6
                                rounded-full
                                bg-zinc-700
                                peer-checked:bg-[#5864be]
                                transition
                                after:content-['']
                                after:absolute
                                after:top-1
                                after:left-1
                                after:w-4
                                after:h-4
                                after:bg-white
                                after:rounded-full
                                after:transition
                                peer-checked:after:translate-x-5
                            "
                        ></div>

                    </label>

                </div>


                <!-- PUBLICAR -->
                <button
                    id="publishBtn"
                    type="submit"
                    disabled
                    class="
                        w-full
                        h-12
                        rounded-2xl
                        bg-[#5864be]
                        text-white
                        font-semibold
                        disabled:opacity-30
                        disabled:cursor-not-allowed
                        hover:opacity-90
                        transition
                    "
                >
                    Publicar Torrent
                </button>

            </div>

        </div>

    </div>

</form>

</div>
