  
<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OMDA Fansub - Tracker</title>

  <link rel="icon" href="favicon.png" type="image/png">

  <link rel="stylesheet" href="css/app.css?v=846">
  <link rel="stylesheet" href="assets/css/home.css">
  <link rel="stylesheet" href="assets/css/tema.css">
  <link rel="stylesheet" href="assets/css/loader.css">

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
  >

  <script src="https://cdn.tailwindcss.com"></script>

  <style>

    body {
      background: #050505;
      color: #f4f4f5;
    }

    #content {
      color: #f4f4f5;
    }

    /* =========================
       APOIO
    ========================= */

    @keyframes apoioEntrada {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes apoioSaida {
      from {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      to {
        opacity: 0;
        transform: translateY(10px) scale(.98);
      }
    }

    .apoio-entrada {
      animation: apoioEntrada .25s ease forwards;
    }

    .apoio-saida {
      animation: apoioSaida .2s ease forwards;
    }

    .apoio-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .apoio-scroll::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 999px;
    }

  </style>

</head>


<body class="myThme">


  <!-- =========================================================
       LOADER
  ========================================================== -->

  <div
    id="app-loader"
    class="fixed inset-0 z-[9999] flex items-center justify-center bg-[#0f0f0f]"
  >

    <div class="text-center">

      <div class="relative mx-auto h-28 w-28">

        <div
          class="absolute inset-0 animate-pulse rounded-full bg-[#5864be] opacity-30 blur-3xl"
        ></div>

      </div>

      <h1 class="mt-8 text-3xl font-bold tracking-wide text-white">
        OMDA
      </h1>

      <p class="mt-2 text-zinc-500">
        Private Tracker
      </p>

      <div class="mx-auto mt-10 h-1 w-72 overflow-hidden rounded-full bg-white/10">

        <div
          id="loader-bar"
          class="h-full rounded-full bg-[#5864be]"
          style="width:0%"
        ></div>

      </div>

      <p
        id="loader-text"
        class="mt-5 text-sm text-zinc-400"
      >
        Inicializando...
      </p>

      <p class="mt-8 text-xs text-zinc-600">
        Version 4.0
      </p>

    </div>

  </div>


  <!-- =========================================================
       APLICAÇÃO
  ========================================================== -->

  <div class="min-h-screen lg:flex">

    <div id="box-sidebar"></div>


    <main
      id="main-content"
      class="flex h-screen flex-1 flex-col overflow-hidden"
    >

      <div id="header"></div>

      <div
        id="content"
        class="flex-1 overflow-auto"
      ></div>

    </main>


    <!-- =======================================================
         USUÁRIO
    ======================================================== -->

    <aside
      id="user-sidebar"
      class="hidden w-80 border-l"
    >

      <div class="user-card">

        <div class="overflow-hidden rounded-3xl">

          <div class="relative h-36">

            <div
              class="absolute inset-0 bg-gradient-to-t from-[#171717] via-[#171717]/60 to-transparent"
            ></div>

            <div
              class="absolute -bottom-10 left-1/2 -translate-x-1/2"
            >

              <img
                src="./assets/capa/avatar.png"
                class="h-20 w-20 rounded-full border-4 border-[#171717] object-cover"
              >

            </div>

          </div>


          <div class="px-6 pb-6 pt-14">

            <div class="user-card">

              <a
                href="#"
                class="group relative block overflow-hidden rounded-3xl border border-white/5 bg-[linear-gradient(180deg,#1a1c28_0%,#12141d_100%)] shadow-[0_0_30px_rgba(88,100,190,.15)]"
              >

                <div
                  class="absolute inset-0 bg-[radial-gradient(circle_at_top,#5864be30,transparent_65%)]"
                ></div>

                <div class="relative p-5">

                  <div class="flex flex-col items-center">

                    <div
                      class="relative h-20 w-20 rounded-3xl bg-[#5864be]/20 p-1 shadow-lg shadow-[#5864be]/30"
                    >

                      <img
                        src="./assets/capa/avatar.png"
                        class="hidden h-full w-full rounded-2xl object-cover"
                      >

                    </div>

                    <h3
                      class="mt-4 text-lg font-bold tracking-wide text-white"
                      data-user-name
                    ></h3>

                    <span
                      data-user-role
                      class="mt-2 rounded-full border border-[#5864be]/30 bg-[#5864be]/15 px-3 py-1 text-[11px] uppercase tracking-widest text-[#b7c2ff]"
                    ></span>

                    <span
                      data-user-email
                      class="mt-2 text-xs text-zinc-500"
                    ></span>

                  </div>


                  <div
                    class="my-5 h-px bg-gradient-to-r from-transparent via-white/10 to-transparent"
                  ></div>


                  <div class="grid grid-cols-2 gap-3">

                    <div class="rounded-2xl border border-white/5 bg-white/[0.03] p-3">

                      <div class="flex items-center gap-2 text-green-400">

                        <i data-lucide="shield-check" class="h-4 w-4"></i>

                        <span class="font-bold">2.22</span>

                      </div>

                      <div class="mt-1 text-[11px] uppercase tracking-wider text-zinc-500">
                        Ratio
                      </div>

                    </div>


                    <div class="rounded-2xl border border-white/5 bg-white/[0.03] p-3">

                      <div class="flex items-center gap-2 text-yellow-400">

                        <i data-lucide="coins" class="h-4 w-4"></i>

                        <span class="font-bold">19.57</span>

                      </div>

                      <div class="mt-1 text-[11px] uppercase tracking-wider text-zinc-500">
                        Otabills
                      </div>

                    </div>


                    <div class="rounded-2xl border border-white/5 bg-white/[0.03] p-3">

                      <div class="flex items-center gap-2 text-cyan-400">

                        <i data-lucide="upload" class="h-4 w-4"></i>

                        <span class="font-bold">4.3 TB</span>

                      </div>

                      <div class="mt-1 text-[11px] uppercase tracking-wider text-zinc-500">
                        Upload
                      </div>

                    </div>


                    <div class="rounded-2xl border border-white/5 bg-white/[0.03] p-3">

                      <div class="flex items-center gap-2 text-red-400">

                        <i data-lucide="download" class="h-4 w-4"></i>

                        <span class="font-bold">1.9 TB</span>

                      </div>

                      <div class="mt-1 text-[11px] uppercase tracking-wider text-zinc-500">
                        Download
                      </div>

                    </div>

                  </div>


                  <button
                    data-logout
                    class="mt-5 flex w-full items-center justify-center gap-2 rounded-2xl border border-red-500/20 bg-red-500/10 py-3 text-sm text-red-300 transition hover:bg-red-500/20 hover:text-white"
                  >

                    <i data-lucide="log-out"></i>

                    <span>Sair da Sessão</span>

                  </button>

                </div>

              </a>

            </div>


            <div class="mt-8 rounded-2xl border border-white/5 bg-white/[0.03] p-4">

              <div class="text-xs uppercase tracking-wider text-zinc-500">
                Continue lendo
              </div>

              <div class="mt-2 font-semibold text-white">
                One Piece
              </div>

              <div class="text-sm text-zinc-400">
                Capítulo 1158 • 82% concluído
              </div>

            </div>


            <div class="mt-6 grid grid-cols-3 gap-3">

              <div class="rounded-2xl bg-white/[0.03] p-3 text-center">

                <div class="text-xl font-bold text-white">
                  247
                </div>

                <div class="mt-1 text-[11px] text-zinc-500">
                  Mangás
                </div>

              </div>


              <div class="rounded-2xl bg-white/[0.03] p-3 text-center">

                <div class="text-xl font-bold text-white">
                  19
                </div>

                <div class="mt-1 text-[11px] text-zinc-500">
                  Sequência
                </div>

              </div>


              <div class="rounded-2xl bg-white/[0.03] p-3 text-center">

                <div class="text-xl font-bold text-white">
                  S
                </div>

                <div class="mt-1 text-[11px] text-zinc-500">
                  Rank
                </div>

              </div>

            </div>


            <button
              class="mt-6 w-full rounded-2xl bg-indigo-600 py-3 font-medium text-white transition hover:bg-indigo-500"
            >
              Continuar Jornada
            </button>


            <button
              data-logout
              class="mt-3 flex w-full items-center justify-center rounded-2xl border border-white/10 py-3 text-zinc-400 transition hover:bg-white/5 hover:text-white"
            >

              <i data-lucide="log-out"></i>

              Sair da conta

            </button>

          </div>

        </div>

      </div>

    </aside>

  </div>


  <!-- FOOTER -->

  <div id="footer"></div>


  

  

  <!-- =========================================================
       SCRIPTS
  ========================================================== -->

  <script src="./assets/js/tema.js"></script>

  <script src="./assets/js/loader.js"></script>

  <script src="https://unpkg.com/lucide@latest"></script>

  <script
    type="module"
    src="./js/app.js"
  ></script>

  <script
    type="module"
    src="./js/permissions.js"
  ></script>

  <script
    type="module"
    src="./js/guard.js"
  ></script>


  <script type="module">

    import "/services/notification.service.js";

    import {
      initSession
    } from "/services/sessionService.js";

    initSession();

  </script>


  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>


  
</body>

</html>
