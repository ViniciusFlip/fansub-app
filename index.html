  
<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portal OMDA Fansub</title>

  <link rel="icon" href="favicon.png" type="image/png">

  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="assets/css/home.css"> 
  <link rel="stylesheet" href="assets/css/tema.css?v=2">
  <link rel="stylesheet" href="assets/css/loader.css">

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
  >

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          },
        colors: {
  ink: '#050505',
  surface: '#101010',
  line: '#242424',
  soft: '#8A8A8A',

  text: '#FFFFFF',
  textMuted: '#B3B3B3',

  accent: '#013bff'
},
          animation: {
            'fade-up': 'fadeUp .6s cubic-bezier(.22,1,.36,1) both',
            'scale-in': 'scaleIn .5s cubic-bezier(.22,1,.36,1) both',
            'pulse-soft': 'pulseSoft 2.5s ease-in-out infinite'
          },
          keyframes: {
            fadeUp: {
              from: {
                opacity: '0',
                transform: 'translateY(18px)'
              },
              to: {
                opacity: '1',
                transform: 'translateY(0)'
              }
            },
            scaleIn: {
              from: {
                opacity: '0',
                transform: 'scale(.97)'
              },
              to: {
                opacity: '1',
                transform: 'scale(1)'
              }
            },
            pulseSoft: {
              '0%,100%': {
                opacity: '.5'
              },
              '50%': {
                opacity: '1'
              }
            }
          }
        }
      }
    }
  </script>

</head>


<body>


  <!-- LOADER -->

<div
  id="app-loader"
  class="fixed inset-0 z-[9999] flex items-center justify-center bg-[#050505]"
>
  <div class="text-center">

    <div class="relative mx-auto h-28 w-28">

      <div
        class="absolute inset-0 animate-pulse rounded-full bg-[#013bff] opacity-30 blur-3xl"
      ></div>

    </div>

    <div class="flex items-center justify-center">

      <a>
        <img
          class="h-14"
          src="assets/images/ft-logo.png"
          alt="Logo"
        >
      </a>

    </div>

    <!-- Barra -->

    <div
      class="mx-auto mt-10 h-1 w-72 overflow-hidden rounded-full bg-white/10"
    >
      <div
        id="loader-bar"
        class="h-full rounded-full bg-[#013bff] transition-all duration-300"
        style="width:0%"
      ></div>
    </div>

    <!-- Status -->

    <p
      id="loader-text"
      class="mt-5 text-sm text-white/40"
    >
      Inicializando...
    </p>

  </div>
</div>


 


  <!-- APLICAÇÃO -->

  <div class="min-h-screen lg:flex">


    <!-- SIDEBAR -->

    <div
      id="box-sidebar"
      class=""
    ></div>



    <!-- ÁREA PRINCIPAL -->

    <main
      id="main-content"
      class="flex h-screen flex-1 flex-col overflow-hidden"
    >


      <!-- HEADER -->

      <div id="header"></div>


      <!-- CONTEÚDO -->

      <div
        id="content"
        class="flex-1 overflow-auto"
      ></div>


    </main>



    <!-- PAINEL DO USUÁRIO -->

    <aside
      id="user-sidebar"
      class="hidden w-80"
    >

      <div class="user-card">

        <div class="overflow-hidden rounded-3xl border border-white/10">


          <!-- Banner -->

          <div class="relative h-36">

            <div
              class="absolute inset-0 bg-gradient-to-t from-[#171717] via-[#171717]/60 to-transparent"
            ></div>


            <!-- Avatar -->

            <div
              class="absolute -bottom-10 left-1/2 -translate-x-1/2"
            >

              <img
                src="assets/images/user-avatar.png"
                class="h-20 w-20 rounded-full border-4 border-[#171717] object-cover"
                alt="Avatar"
              >

            </div>

          </div>



          <!-- Conteúdo -->

          <div class="px-6 pb-6 pt-14">

            <div class="user-card">

              <a
                href="#"
                class="group relative block overflow-hidden rounded-3xl border border-white/5"
              >


                <!-- Glow -->

                <div
                  class="absolute inset-0 bg-[radial-gradient(circle_at_top,#5864be30,transparent_65%)]"
                ></div>


                <div class="relative p-5">


                  <!-- Avatar / Dados -->

                  <div class="flex flex-col items-center">

                    <h3
                      class="mt-4 text-lg font-bold tracking-wide text-white"
                      data-user-name
                    ></h3>

                    <span
                      data-user-role
                      class="mt-2 rounded-full border border-[#5864be]/30 bg-[#5864be]/15 px-3 py-1 text-[11px] uppercase tracking-widest text-[#b7c2ff]"
                    ></span>

                    <span
                      data-user-email
                      class="mt-2 text-xs text-zinc-500"
                    ></span>

                  </div>



                  <!-- Divider -->

                  <div
                    class="my-5 h-px bg-gradient-to-r from-transparent via-white/10 to-transparent"
                  ></div>



                  <!-- Stats -->

                  <div class="grid grid-cols-2 gap-3">


                    <div
                      class="rounded-2xl border border-white/5 bg-white/[0.03] p-3"
                    >

                      <div class="flex items-center gap-2 text-green-400">

                        <i
                          data-lucide="shield-check"
                          class="h-4 w-4"
                        ></i>

                        <span class="font-bold">
                          2.22
                        </span>

                      </div>

                      <div
                        class="mt-1 text-[11px] uppercase tracking-wider text-zinc-500"
                      >
                        Ratio
                      </div>

                    </div>



                    <div
                      class="rounded-2xl border border-white/5 bg-white/[0.03] p-3"
                    >

                      <div class="flex items-center gap-2 text-yellow-400">

                        <i
                          data-lucide="coins"
                          class="h-4 w-4"
                        ></i>

                        <span class="font-bold">
                          19.57
                        </span>

                      </div>

                      <div
                        class="mt-1 text-[11px] uppercase tracking-wider text-zinc-500"
                      >
                        Otabills
                      </div>

                    </div>



                    <div
                      class="rounded-2xl border border-white/5 bg-white/[0.03] p-3"
                    >

                      <div class="flex items-center gap-2 text-cyan-400">

                        <i
                          data-lucide="upload"
                          class="h-4 w-4"
                        ></i>

                        <span class="font-bold">
                          4.3 TB
                        </span>

                      </div>

                      <div
                        class="mt-1 text-[11px] uppercase tracking-wider text-zinc-500"
                      >
                        Upload
                      </div>

                    </div>



                    <div
                      class="rounded-2xl border border-white/5 bg-white/[0.03] p-3"
                    >

                      <div class="flex items-center gap-2 text-red-400">

                        <i
                          data-lucide="download"
                          class="h-4 w-4"
                        ></i>

                        <span class="font-bold">
                          1.9 TB
                        </span>

                      </div>

                      <div
                        class="mt-1 text-[11px] uppercase tracking-wider text-zinc-500"
                      >
                        Download
                      </div>

                    </div>

                  </div>



                  <!-- Logout -->

                  <button
                    data-logout
                    type="button"
                    class="mt-5 flex w-full items-center justify-center gap-2 rounded-2xl border border-red-500/20 bg-red-500/10 py-3 text-sm text-red-300 transition hover:bg-red-500/20 hover:text-white"
                  >

                    <i data-lucide="log-out"></i>

                    <span>
                      Sair da Sessão
                    </span>

                  </button>


                </div>

              </a>

            </div>



            <!-- Continue lendo -->

            <div
              class="mt-8 rounded-2xl border border-white/5 bg-white/[0.03] p-4"
            >

              <div class="text-xs uppercase tracking-wider text-zinc-500">
                Continue lendo
              </div>

              <div class="mt-2 font-semibold text-white">
                One Piece
              </div>

              <div class="text-sm text-zinc-400">
                Capítulo 1158 • 82% concluído
              </div>

            </div>



            <!-- Estatísticas -->

            <div class="mt-6 grid grid-cols-3 gap-3">

              <div
                class="rounded-2xl bg-white/[0.03] p-3 text-center"
              >

                <div class="text-xl font-bold text-white">
                  247
                </div>

                <div class="mt-1 text-[11px] text-zinc-500">
                  Mangás
                </div>

              </div>


              <div
                class="rounded-2xl bg-white/[0.03] p-3 text-center"
              >

                <div class="text-xl font-bold text-white">
                  19
                </div>

                <div class="mt-1 text-[11px] text-zinc-500">
                  Sequência
                </div>

              </div>


              <div
                class="rounded-2xl bg-white/[0.03] p-3 text-center"
              >

                <div class="text-xl font-bold text-white">
                  S
                </div>

                <div class="mt-1 text-[11px] text-zinc-500">
                  Rank
                </div>

              </div>

            </div>



            <!-- Ação -->

            <button
              class="mt-6 w-full rounded-2xl bg-indigo-600 py-3 font-medium text-white transition hover:bg-indigo-500"
            >
              Continuar Jornada
            </button>



            <!-- Logout -->

            <button
              data-logout
              type="button"
              class="mt-3 flex w-full items-center justify-center rounded-2xl border border-white/10 py-3 text-zinc-400 transition hover:bg-white/5 hover:text-white"
            >

              <i data-lucide="log-out"></i>

              Sair da conta

            </button>


          </div>

        </div>

      </div>

    </aside>

  </div>



  <!-- FOOTER -->

  <div id="footer"></div>



  <!-- TEMA -->

  <script src="assets/js/tema.js"></script>



  <!-- LOADER -->

  <script src="assets/js/loader.js"></script>



  <!-- LUCIDE -->

  <script src="https://unpkg.com/lucide@latest"></script>



  <!-- SWIPER -->

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>



  <!-- APP -->

  <script
    type="module"
    src="js/app.js"
  ></script>


</body>

</html>
