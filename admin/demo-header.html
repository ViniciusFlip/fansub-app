<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Header Bootstrap 3.3.6</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>

        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#111;
        }

        /* HEADER */

        .custom-navbar{
            background:transparent;
            border:none;
            position:absolute;
            top:0;
            left:0;
            width:100%;
            z-index:999;
            padding:15px 0;
        }

        .navbar-brand{
            color:#fff !important;
            font-size:28px;
            font-weight:bold;
            padding:0;
            height:auto;
        }

        /* MENU */

        .desktop-menu{
            display:flex;
            align-items:center;
            gap:30px;
        }

        .desktop-menu a{
            color:#fff;
            text-transform:uppercase;
            font-size:13px;
            text-decoration:none;
            font-weight:600;
        }

        .desktop-menu a:hover{
            opacity:.8;
        }

        /* ICONS */

        .header-icons{
            display:flex;
            align-items:center;
            gap:20px;
        }

        .header-icons a{
            color:#fff;
            font-size:18px;
            text-decoration:none;
        }

        /* DESKTOP */

        .desktop-header{
            display:flex;
            align-items:center;
            justify-content:space-between;
        }

        /* MOBILE */

        .mobile-header{
            display:none;
        }

        @media(max-width:767px){

            .custom-navbar{
                background:#222;
                position:relative;
                padding:0;
            }

            .desktop-header{
                display:none;
            }

            .mobile-header{
                display:flex;
                align-items:center;
                justify-content:space-between;
                padding:15px;
            }

            /* MENU BUTTON */

            .navbar-toggle{
                display:block !important;
                margin:0;
                padding:0;
                border:none;
                background:transparent !important;
            }

            .navbar-toggle .icon-bar{
                background:#fff !important;
                width:22px;
            }

            /* LOGO */

            .mobile-logo{
                color:#fff !important;
                font-size:24px;
                font-weight:bold;
                text-decoration:none !important;
            }

            /* LOGIN */

            .mobile-login{
                color:#fff;
                font-size:18px;
                text-decoration:none;
            }

            /* MOBILE MENU */

            .mobile-menu{
                background:#222;
            }

            .mobile-menu ul{
                margin:0;
            }

            .mobile-menu ul li a{
                color:#fff !important;
                padding:15px;
                border-top:1px solid rgba(255,255,255,.05);
                text-transform:uppercase;
                font-size:13px;
            }

        }

        /* DEMO */

        .hero{
            height:100vh;
            background:linear-gradient(135deg,#5864be,#111);
        }

    </style>
</head>
<body>

<nav class="navbar navbar-default custom-navbar">

    <div class="container">

        <!-- MOBILE -->
        <div class="mobile-header">

            <!-- MENU -->
            <button type="button"
                    class="navbar-toggle collapsed"
                    data-toggle="collapse"
                    data-target="#mobileMenu">

                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>

            <!-- LOGO -->
            <a href="#" class="mobile-logo">
                OMDA
            </a>

            <!-- LOGIN ICON -->
            <a href="#" class="mobile-login">
                <i class="fa fa-user"></i>
            </a>

        </div>

        <!-- DESKTOP -->
        <div class="desktop-header">

            <!-- LOGO -->
            <a class="navbar-brand" href="#">
                OMDA
            </a>

            <!-- MENU -->
            <div class="desktop-menu">
                <a href="#">Home</a>
                <a href="#">Sobre</a>
                <a href="#">Serviços</a>
                <a href="#">Contato</a>
            </div>

            <!-- ICONS -->
            <div class="header-icons">

                <!-- SEARCH -->
                <a href="#">
                    <i class="fa fa-search"></i>
                </a>

                <!-- LOGIN -->
                <a href="#">
                    <i class="fa fa-user"></i>
                </a>

            </div>

        </div>

    </div>

    <!-- MOBILE MENU -->
    <div class="collapse navbar-collapse mobile-menu" id="mobileMenu">

        <ul class="nav navbar-nav">

            <li><a href="#">Home</a></li>
            <li><a href="#">Sobre</a></li>
            <li><a href="#">Serviços</a></li>
            <li><a href="#">Contato</a></li>

        </ul>

    </div>

</nav>

<div class="hero"></div>

<!-- JQUERY -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>

<!-- BOOTSTRAP -->
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"></script>

</body>
</html>
